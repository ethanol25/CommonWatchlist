<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Common Watchlist</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
    textarea { width: 100%; height: 120px; padding: 0.5rem; margin-bottom: 1rem; font-family: monospace; }
    button { padding: 0.5rem 1rem; cursor: pointer; background: #000; color: #fff; border: none; }
    button:hover { background: #333; }
    .results { margin-top: 2rem; padding: 1rem; background: #f4f4f4; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>A Common Watchlist: Watchlist Comparison</h1>
  
  <div class="input-group">
    <label for="usernames"><strong>Enter usernames:</strong> (comma or newline separated)</label><br>
    <textarea id="usernames" placeholder="user1&#10;user2&#10;user3"></textarea><br>
    <button id="compareBtn">Find Similarities</button>
  </div>

  <div id="status" style="margin-top: 1rem; font-weight: bold;"></div>
  
  <div class="results" id="resultsContainer" style="display: none;">
    <h3>Similar Items (<span id="matchCount">0</span>)</h3>
    <ul id="matchList"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
